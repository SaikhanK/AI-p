<html>
<h1>test123</h1>

<body>
    <div class="product-list">
        <div class="product-card" *ngFor="let product of products">
            <h2 class="product-title">
                {{ product.title }}
            </h2>

            <p class="product-price">
                {{ product.price | number:'1.2-2' }}€
            </p>
            <a [routerLink]="['/productdetail', product.id]">View</a>
        </div>
    </div>
</body>

</html>
