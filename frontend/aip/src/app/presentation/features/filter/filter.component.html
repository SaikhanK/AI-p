<div class="filter-container">
    @for (filter of availableFilters; track filter.key) {
      <mat-form-field appearance="outline">
        <mat-label>{{ filter.key }}</mat-label>
        
        <mat-select (selectionChange)="onFilterChange(filter.key, $event.value)">
          @for (choice of filter.choices; track choice) {
            <mat-option [value]="choice">{{ choice }}</mat-option>
          }
        </mat-select>
        
      </mat-form-field>
    }
  </div>
