<div class="filter-shell">

  <div class="filter-items">
    <div class="filter-item" *ngFor="let filter of availableFilters">
      <label class="filter-label">{{ filter.key | titlecase }}</label>
      
      <mat-form-field appearance="outline" class="full-width custom-select-field">
        <mat-select [(value)]="filter.value" (selectionChange)="onFilterSelect(filter.key, $event.value)"
          [placeholder]="'Alle'">
          <mat-option *ngFor="let choice of filter.choices" [value]="choice">
            {{ choice }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
  
  <button class="reset-btn" (click)="onResetFilter()">
    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1 4 1 10 7 10" />
      <path d="M3.51 15a9 9 0 1 0 .49-3.51" />
    </svg>
    Filter zurücksetzen
  </button>

</div>
