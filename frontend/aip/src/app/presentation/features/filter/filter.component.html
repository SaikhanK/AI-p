<div class="filter-container">
  <div *ngFor="let filter of availableFilters">

    <mat-form-field>
      <mat-label>{{ filter.key }}</mat-label>
  
      <mat-select (selectionChange)="onFilterSelect(filter.key, $event.value)">
        <mat-option *ngFor="let choice of filter.choices" [value]="choice">
          {{ choice }}
        </mat-option>
      </mat-select>
  
    </mat-form-field>
  
  </div>
  </div>
